aid: sendspark
name: Sendspark
description: >-
  Sendspark is a video messaging and AI-personalized video platform for sales and
  marketing teams. Users record a single video and use AI voice cloning, lip sync,
  merge tags, and dynamic thumbnails to personalize it to each prospect at scale,
  delivered through custom landing pages with embedded booking calendars and
  call-to-action buttons. Sendspark ships a Chrome extension and desktop recorder,
  60+ CRM/email/automation integrations (HubSpot, Salesforce, Salesloft, Clay,
  Zapier, Make), a public REST API for Dynamic Video campaigns, prospects, DVM
  bundles, and outbound webhooks, and a hosted read-only MCP server for AI
  assistants. It was surfaced as a portfolio company of 500 Global.
