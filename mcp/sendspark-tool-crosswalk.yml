findings:
- >-
  The two surfaces are non-identical projections in BOTH directions. MCP is the
  only way to read prospect lists and campaign analytics; REST is the only way
  to write anything, manage webhooks, or read campaign settings and DVM minute
  balances.
- >-
  Four of the six MCP tools have a backing REST operation, but none is a pure
  passthrough — every bound tool adds cursor pagination, search, or richer
  diagnostics beyond what the published OpenAPI declares. The OpenAPI is
  self-described as a draft scaffold, which is the most likely explanation.
