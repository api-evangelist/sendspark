notes: >-
  API credentials are plan-gated: the docs state "if you see a badge next to the
  feature, your plan needs an upgrade to access API keys"
  (https://help.sendspark.com/how-to-create-api-keys.md). The hosted MCP server
  is explicitly restricted to the Growth, Team, and Business plans — free and
  trial workspaces are excluded, and Solo is not listed
