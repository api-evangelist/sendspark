summary: >-
  Sendspark publishes NO request-rate limit for its REST API: no requests-per-
  second/minute/hour figure, no burst allowance, no X-RateLimit-* or RateLimit-*
  response headers, no Retry-After contract, and no 429 response anywhere in the
  published OpenAPI (the spec declares only 200, 204, 400, 403, 404 and 503).
  What Sendspark does publish are VOLUME QUOTAS — per-campaign and per-batch
  caps on video/lead generation, MCP page-size ceilings, and an advisory
  third-party throughput ceiling for LinkedIn-backed backgrounds. Those are
  recorded below and are plan-scoped, not request-scoped. An agent integrating
  Sendspark has no runtime rate-limit signal to back off against.
