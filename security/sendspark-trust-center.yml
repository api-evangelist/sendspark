findings:
- >-
  Sendspark operates a trust center at security.sendspark.com, but it is not
  linked from the sendspark.com footer (which links only /privacy and /terms)
  and it is not discoverable from the docs. A buyer or an agent looking for
  Sendspark's compliance posture has no path to it from the public site.
- >-
  NO named certification (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP, GDPR, CSA
  STAR) could be confirmed from any machine-readable surface. This artifact
  records the presence of the trust center, NOT a compliance claim — no
  `Compliance` pointer is emitted, because nothing verifiable was published in
  a form a machine can read.
remediation_for_provider:
- Link security.sendspark.com from the sendspark.com footer and from help.sendspark.com.
- Publish a server-rendered or JSON summary of certifications so the trust center is machine-readable.
- Serve a /.well-known/security.txt (RFC 9116) — no Sendspark host serves one today.
