notes: >-
  Sendspark serves a real, non-empty /.well-known/ surface on three of its five
  hosts. The MCP OAuth surface publishes RFC 8414 authorization-server metadata
  and RFC 9728 protected-resource metadata at apiv2.sendspark.com, and the
  issuer auth.sendspark.com publishes full OIDC discovery. The documentation
  host publishes an A2A agent card and a linked Agent Skill. The REST API host
  (api-gw.sendspark.com) — which uses x-api-key/x-api-secret header auth —
  exposes no /.well-known documents at all, and no host anywhere serves a
  security.txt.
